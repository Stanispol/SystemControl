version: '3.9'

services:
  backend:
    build: ./backend
    container_name: systemcontrol_backend
    ports:
      - "5000:5000"
    env_file: .env
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: systemcontrol_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  db:
    image: postgres:14
    container_name: systemcontrol_db
    restart: always
    environment:
      POSTGRES_USER: 
      POSTGRES_PASSWORD: 
      POSTGRES_DB: 
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
